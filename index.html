<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Worship Stage FX Pro</title>
<style>
/* ============================================================
   WORSHIP STAGE FX PRO — FASE 1 (Estrutura + Estilo)
   Tema Dark Worship
   ============================================================ */

:root{
  /* Superfícies */
  --bg:            #0a0b10;
  --bg-soft:       #0d0f16;
  --card:          #13151f;
  --card-2:        #171a26;
  --border:        #23273a;
  --border-soft:   #1b1f2e;

  /* Texto */
  --text:          #e8eaf6;
  --text-dim:      #9aa1bd;
  --text-faint:    #646b85;

  /* Destaques */
  --indigo:        #6366f1;
  --indigo-soft:   rgba(99,102,241,.16);
  --cyan:          #06b6d4;
  --cyan-soft:     rgba(6,182,212,.14);

  /* Categorias */
  --pink:          #ec4899;
  --amber:         #f59e0b;
  --purple:        #a855f7;
  --red:           #ef4444;
  --green:         #10b981;

  /* Métricas */
  --radius:        14px;
  --radius-sm:     10px;
  --shadow:        0 8px 24px rgba(0,0,0,.45);
  --glow-indigo:   0 0 0 1px var(--indigo), 0 0 18px rgba(99,102,241,.35);
}

/* ---------- Reset / Touch ---------- */
*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  /* Impede zoom por duplo toque / seleção indesejada */
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

body{
  min-height:100vh;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  background:
    radial-gradient(900px 420px at 50% -12%, rgba(99,102,241,.13), transparent 62%),
    radial-gradient(700px 360px at 100% 4%, rgba(6,182,212,.08), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}

button,input,select{ font-family:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
input[type=range]{ -webkit-appearance:none; appearance:none; background:transparent; }

/* ============================================================
   HEADER
   ============================================================ */
.header{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(10,11,16,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.brand h1{
  margin:0;
  font-size:15px; font-weight:800; letter-spacing:.6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(90deg,#fff 0%, var(--indigo) 55%, var(--cyan) 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.brand span{
  font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--text-faint); font-weight:600;
}

/* Status badge */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px;
  border-radius:999px;
  font-size:10.5px; font-weight:700; letter-spacing:.5px;
  white-space:nowrap;
  color:#ffdada;
  background:rgba(239,68,68,.13);
  border:1px solid rgba(239,68,68,.42);
  box-shadow:0 0 14px rgba(239,68,68,.16) inset;
  transition:all .25s ease;
}
.badge .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--red);
  box-shadow:0 0 8px var(--red);
  animation:pulse 1.8s ease-in-out infinite;
}
.badge.connected{
  color:#ccfbef;
  background:rgba(16,185,129,.13);
  border-color:rgba(16,185,129,.45);
}
.badge.connected .dot{ background:var(--green); box-shadow:0 0 8px var(--green); }

@keyframes pulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.82)} }

/* ============================================================
   VISUALIZADOR
   ============================================================ */
.viz-wrap{
  position:sticky; top:56px; z-index:40;
  height:45px;
  background:
    linear-gradient(180deg,#07080d 0%, #0b0d14 100%);
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
#viz{ display:block; width:100%; height:45px; }
.viz-wrap::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(99,102,241,.06), transparent 45%, rgba(6,182,212,.05));
}

/* ============================================================
   LAYOUT
   ============================================================ */
.main{ max-width:820px; margin:0 auto; padding:16px 14px; }

.section{ margin-bottom:22px; }
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin:0 2px 10px;
}
.section-title{
  display:flex; align-items:center; gap:8px;
  font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text-dim);
}
.section-title::before{
  content:""; width:3px; height:13px; border-radius:2px;
  background:linear-gradient(180deg,var(--indigo),var(--cyan));
}
.section-hint{ font-size:10px; color:var(--text-faint); letter-spacing:.4px; }

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
}

/* ============================================================
   BARRA MASTER
   ============================================================ */
.master{ display:flex; flex-direction:column; gap:14px; }

.vol-row{ display:flex; align-items:center; gap:12px; }
.vol-row .icon{ font-size:17px; opacity:.85; line-height:1; }
.vol-value{
  min-width:52px; text-align:right;
  font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;
  color:var(--cyan);
  text-shadow:0 0 12px rgba(6,182,212,.45);
}

.slider{ flex:1; height:30px; display:flex; align-items:center; }
.slider input[type=range]{
  width:100%; height:6px; margin:0;
  border-radius:999px;
  background:linear-gradient(90deg, var(--indigo) 0%, var(--cyan) var(--fill,80%), #22263a var(--fill,80%), #22263a 100%);
  outline:none;
}
.slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:20px; height:20px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, #c7d2fe 45%, var(--indigo) 100%);
  border:2px solid #0a0b10;
  box-shadow:0 0 0 1px var(--indigo), 0 0 14px rgba(99,102,241,.65);
  cursor:grab;
}
.slider input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, #c7d2fe 45%, var(--indigo) 100%);
  border:2px solid #0a0b10;
  box-shadow:0 0 0 1px var(--indigo), 0 0 14px rgba(99,102,241,.65);
  cursor:grab;
}

.master-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 10px;
  border-radius:var(--radius-sm);
  font-size:12px; font-weight:800; letter-spacing:.9px;
  border:1px solid var(--border);
  background:var(--card-2);
  color:var(--text);
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.btn:active{ transform:scale(.96); }

.btn-stop{
  color:#ffe3e3;
  background:linear-gradient(180deg, rgba(239,68,68,.20), rgba(239,68,68,.10));
  border-color:rgba(239,68,68,.55);
  box-shadow:0 0 18px rgba(239,68,68,.18);
}
.btn-stop:active{ background:rgba(239,68,68,.35); box-shadow:0 0 26px rgba(239,68,68,.45); }

.btn-wake{
  color:#fff6dd;
  background:linear-gradient(180deg, rgba(245,158,11,.16), rgba(245,158,11,.07));
  border-color:rgba(245,158,11,.45);
}
.btn-wake.active{
  color:#eafff8;
  background:linear-gradient(180deg, rgba(16,185,129,.20), rgba(16,185,129,.08));
  border-color:rgba(16,185,129,.55);
  box-shadow:0 0 18px rgba(16,185,129,.22);
}

/* ============================================================
   COLCHÃO DE ADORAÇÃO (TONE PADS) — 6 x 2
   ============================================================ */
.tone-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}
.tone{
  position:relative;
  aspect-ratio:1/1;
  min-height:46px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:linear-gradient(180deg, var(--card-2), #10121b);
  font-size:13px; font-weight:700; color:var(--text-dim);
  overflow:hidden;
  transition:transform .12s ease, color .18s ease, border-color .18s ease, box-shadow .2s ease, background .2s ease;
}
.tone .sub{
  display:block; margin-top:2px;
  font-size:7.5px; font-weight:600; letter-spacing:.4px;
  color:var(--text-faint);
}
.tone:hover{
  color:var(--text);
  border-color:rgba(99,102,241,.55);
  box-shadow:0 0 16px rgba(99,102,241,.20);
  transform:translateY(-2px);
}
.tone:active{ transform:scale(.94); }
.tone.active{
  color:#fff;
  border-color:var(--indigo);
  background:linear-gradient(180deg, var(--indigo) 0%, #4f46e5 100%);
  box-shadow:var(--glow-indigo);
  animation:tonePop .22s ease;
}
.tone.active .sub{ color:rgba(255,255,255,.75); }
@keyframes tonePop{ 0%{transform:scale(.9)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }

/* ============================================================
   CENAS DE CULTO — chips roláveis
   ============================================================ */
.scenes{
  display:flex; gap:9px;
  overflow-x:auto; overflow-y:hidden;
  padding:4px 2px 10px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.scenes::-webkit-scrollbar{ display:none; }

.chip{
  flex:0 0 auto;
  display:flex; align-items:center; gap:8px;
  padding:11px 16px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card-2);
  color:var(--text-dim);
  font-size:11.5px; font-weight:700; letter-spacing:.6px;
  white-space:nowrap;
  scroll-snap-align:start;
  transition:transform .12s ease, color .18s ease, border-color .18s ease, box-shadow .2s ease, background .2s ease;
}
.chip .num{
  font-size:10px; font-weight:800; color:var(--text-faint);
  padding:2px 6px; border-radius:6px;
  background:rgba(255,255,255,.05);
}
.chip:hover{ color:var(--text); border-color:rgba(6,182,212,.5); transform:translateY(-2px); }
.chip:active{ transform:scale(.96); }
.chip.active{
  color:#eaffff;
  border-color:var(--cyan);
  background:linear-gradient(180deg, rgba(6,182,212,.22), rgba(6,182,212,.08));
  box-shadow:0 0 0 1px var(--cyan), 0 0 20px rgba(6,182,212,.32);
}
.chip.active .num{ color:#0a2b31; background:var(--cyan); }

/* ============================================================
   PADS DE DISPARO — 4 x 4
   ============================================================ */
.pads{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.pad{
  position:relative;
  aspect-ratio:1/1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px;
  padding:6px 4px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  border-left:3px solid var(--cat,var(--indigo));
  background:linear-gradient(180deg, var(--card-2), #0f111a);
  overflow:hidden;
  transition:transform .1s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.pad::before{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--cat) 16%, transparent), transparent 62%);
  opacity:0; transition:opacity .2s ease;
  pointer-events:none;
}
.pad:hover{ transform:translateY(-3px); border-color:var(--cat); box-shadow:0 10px 24px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb, var(--cat) 28%, transparent); }
.pad:hover::before{ opacity:1; }
.pad:active{ transform:scale(.93); }
.pad .emoji{ font-size:22px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.pad .name{
  font-size:8.5px; font-weight:700; letter-spacing:.35px;
  text-align:center; line-height:1.15;
  color:var(--text-dim);
  padding:0 2px;
}
.pad .tag{
  position:absolute; top:5px; right:6px;
  font-size:6.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
  color:var(--cat); opacity:.6;
}
.pad.trigger{
  animation:padHit .28s ease;
  border-color:var(--cat);
  box-shadow:0 0 0 2px var(--cat), 0 0 26px color-mix(in srgb, var(--cat) 45%, transparent);
}
.pad.trigger::before{ opacity:1; }
.pad.trigger .name{ color:#fff; }
@keyframes padHit{
  0%{ transform:scale(.9); filter:brightness(1.9); }
  55%{ transform:scale(1.05); filter:brightness(1.35); }
  100%{ transform:scale(1); filter:brightness(1); }
}

/* ============================================================
   RODAPÉ
   ============================================================ */
.footer{
  text-align:center;
  font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--text-faint);
  padding-top:6px;
}

/* ============================================================
   RESPONSIVO
   ============================================================ */
@media (max-width:420px){
  .tone{ font-size:12px; }
  .pad .emoji{ font-size:19px; }
  .pad .name{ font-size:7.5px; }
  .btn{ font-size:11px; letter-spacing:.5px; padding:13px 6px; }
}
@media (min-width:700px){
  .main{ padding:20px 18px; }
  .tone{ min-height:56px; }
  .pad .emoji{ font-size:26px; }
  .pad .name{ font-size:9.5px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header class="header">
  <div class="brand">
    <h1>🎹 WORSHIP STAGE FX</h1>
    <span>Stage Console · Fase 1</span>
  </div>
  <div class="badge" id="midiBadge">
    <span class="dot"></span>
    <span id="midiText">MIDI: Desconectado</span>
  </div>
</header>

<!-- ======================= VISUALIZADOR ========================== -->
<div class="viz-wrap">
  <canvas id="viz" height="45"></canvas>
</div>

<main class="main">

  <!-- ====================== BARRA MASTER ========================= -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">Master</div>
      <div class="section-hint" id="masterHint">Saída principal</div>
    </div>

    <div class="card master">
      <div class="vol-row">
        <span class="icon">🔊</span>
        <div class="slider">
          <input type="range" id="masterVol" min="0" max="100" step="1" value="80" aria-label="Volume Master">
        </div>
        <span class="vol-value" id="volValue">80%</span>
      </div>

      <div class="master-actions">
        <button class="btn btn-stop" id="panicBtn">⏹ STOP ALL</button>
        <button class="btn btn-wake" id="btnWake">💡 TELA LIGADA</button>
      </div>
    </div>
  </section>

  <!-- ==================== COLCHÃO DE ADORAÇÃO ==================== -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">Colchão de Adoração</div>
      <div class="section-hint" id="toneHint">Toque para sustentar</div>
    </div>

    <div class="card">
      <div class="tone-grid" id="toneGrid">
        <button class="tone" data-note="C">C<span class="sub">DÓ</span></button>
        <button class="tone active" data-note="C#">C#<span class="sub">DÓ#</span></button>
        <button class="tone" data-note="D">D<span class="sub">RÉ</span></button>
        <button class="tone" data-note="D#">D#<span class="sub">RÉ#</span></button>
        <button class="tone" data-note="E">E<span class="sub">MI</span></button>
        <button class="tone" data-note="F">F<span class="sub">FÁ</span></button>
        <button class="tone" data-note="F#">F#<span class="sub">FÁ#</span></button>
        <button class="tone" data-note="G">G<span class="sub">SOL</span></button>
        <button class="tone" data-note="G#">G#<span class="sub">SOL#</span></button>
        <button class="tone" data-note="A">A<span class="sub">LÁ</span></button>
        <button class="tone" data-note="A#">A#<span class="sub">LÁ#</span></button>
        <button class="tone" data-note="B">B<span class="sub">SI</span></button>
      </div>
    </div>
  </section>

  <!-- ====================== CENAS DE CULTO ======================= -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">Cenas de Culto</div>
      <div class="section-hint">arraste →</div>
    </div>

    <div class="scenes" id="sceneBar">
      <button class="chip" data-scene="1"><span class="num">01</span>INTRO / AMBIÊNCIA</button>
      <button class="chip active" data-scene="2"><span class="num">02</span>VERSO SUAVE</button>
      <button class="chip" data-scene="3"><span class="num">03</span>REFRÃO FORTE</button>
      <button class="chip" data-scene="4"><span class="num">04</span>ESPONTÂNEO</button>
    </div>
  </section>

  <!-- ====================== PADS DE DISPARO ====================== -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">Pads de Disparo</div>
      <div class="section-hint" id="padHint">16 pads</div>
    </div>

    <div class="pads" id="padGrid">

      <!-- DRUMS (rosa) -->
      <button class="pad" style="--cat:#ec4899" data-id="kick808"><span class="tag">Drum</span><span class="emoji">🥁</span><span class="name">808 Kick</span></button>
      <button class="pad" style="--cat:#ec4899" data-id="snare"><span class="tag">Drum</span><span class="emoji">🎩</span><span class="name">Worship Snare</span></button>
      <button class="pad" style="--cat:#ec4899" data-id="clap"><span class="tag">Drum</span><span class="emoji">👏</span><span class="name">Clap</span></button>
      <button class="pad" style="--cat:#ec4899" data-id="snap"><span class="tag">Drum</span><span class="emoji">🫰</span><span class="name">Finger Snap</span></button>

      <!-- FX (ciano) -->
      <button class="pad" style="--cat:#06b6d4" data-id="riser"><span class="tag">FX</span><span class="emoji">📈</span><span class="name">Swell Riser</span></button>
      <button class="pad" style="--cat:#06b6d4" data-id="impact"><span class="tag">FX</span><span class="emoji">💥</span><span class="name">Sub Impact</span></button>
      <button class="pad" style="--cat:#06b6d4" data-id="noise"><span class="tag">FX</span><span class="emoji">🌫️</span><span class="name">White Noise</span></button>
      <button class="pad" style="--cat:#06b6d4" data-id="shaker"><span class="tag">FX</span><span class="emoji">🪇</span><span class="name">Shaker</span></button>

      <!-- AMBIENT (âmbar) -->
      <button class="pad" style="--cat:#f59e0b" data-id="strings"><span class="tag">Amb</span><span class="emoji">🎻</span><span class="name">Warm Strings</span></button>
      <button class="pad" style="--cat:#f59e0b" data-id="choir"><span class="tag">Amb</span><span class="emoji">🕊️</span><span class="name">Coro Celestial</span></button>
      <button class="pad" style="--cat:#f59e0b" data-id="pandeiro"><span class="tag">Amb</span><span class="emoji">🪘</span><span class="name">Pandeiro</span></button>
      <button class="pad" style="--cat:#f59e0b" data-id="chimes"><span class="tag">Amb</span><span class="emoji">🎐</span><span class="name">Chimes</span></button>

      <!-- VOICE / EXTRA (roxo) -->
      <button class="pad" style="--cat:#a855f7" data-id="grito"><span class="tag">Vox</span><span class="emoji">📣</span><span class="name">Grito Guerra</span></button>
      <button class="pad" style="--cat:#a855f7" data-id="aplausos"><span class="tag">Vox</span><span class="emoji">🙌</span><span class="name">Aplausos</span></button>
      <button class="pad" style="--cat:#a855f7" data-id="subdrop"><span class="tag">Vox</span><span class="emoji">🔉</span><span class="name">Sub Drop</span></button>
      <button class="pad" style="--cat:#a855f7" data-id="reverse"><span class="tag">Vox</span><span class="emoji">⏪</span><span class="name">Reverse FX</span></button>

    </div>
  </section>

  <div class="footer">Worship Stage FX Pro · Fase 1 · Estrutura &amp; Estilo</div>
</main>

<script>
/* FASE 2 — Web Audio API: colchão contínuo e análise em tempo real. */
(function () {
  'use strict';

  var audioCtx = null, masterGain = null, analyser = null, frequencyData = null;
  var voices = new Set(); // Inclui as notas que ainda estão em release.
  var activePad = null, activeNote = null;
  var actionVersion = 0; // Invalida notas pendentes ao parar/trocar durante resume().
  var frequencies = {
    'C': 130.81, 'C#': 138.59, 'D': 146.83, 'D#': 155.56,
    'E': 164.81, 'F': 174.61, 'F#': 185.00, 'G': 196.00,
    'G#': 207.65, 'A': 220.00, 'A#': 233.08, 'B': 246.94
  };

  async function ensureAudio() {
    if (!audioCtx) {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('Web Audio API indisponível');
      audioCtx = new AudioContextClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.75;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      // Saída audível explícita. O analyser é uma derivação de medição:
      // NÃO conectá-lo também ao destination, pois isso duplicaria o sinal.
      masterGain.connect(audioCtx.destination);
      masterGain.connect(analyser);
      // Respeita inclusive volume/mudo selecionado antes da inicialização.
      applyVolume();
    }
    if (audioCtx.state !== 'running') {
      // Chamado dentro do gesto, antes do primeiro await (Chrome/Android/iOS).
      await audioCtx.resume();
    }
    if (audioCtx.state !== 'running') throw new Error('Contexto de áudio não está ativo');
  }

  function reportAudioError(err) {
    stopAll();
    toneHint.textContent = 'Áudio indisponível. Toque novamente para tentar.';
    console.error('Não foi possível iniciar o áudio:', err);
  }

  function unlockAudio() {
    ensureAudio().catch(reportAudioError);
  }
  // Capture executa resume() antes dos controles, inclusive no primeiro toque.
  document.addEventListener('pointerdown', unlockAudio, { capture: true });
  document.addEventListener('click', unlockAudio, { capture: true });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  class AmbientPad {
    constructor(frequency) {
      var now = audioCtx.currentTime;
      this.startedAt = now;
      this.releasing = false;
      this.disposed = false;
      this.filter = audioCtx.createBiquadFilter();
      this.filter.type = 'lowpass';
      this.filter.frequency.value = 800;
      this.filter.Q.value = 2.2;
      this.envelope = audioCtx.createGain();
      this.filter.connect(this.envelope);
      this.envelope.connect(masterGain);
      // Ataque curto audível confirma o toque sem um beep alheio ao tom.
      this.envelope.gain.setValueAtTime(0.001, now);
      this.envelope.gain.linearRampToValueAtTime(0.06, now + 0.02);
      this.envelope.gain.linearRampToValueAtTime(0.6, now + 1.2);
      this.oscillators = [-7, 0, 7].map(function (cents) {
        var osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = frequency;
        osc.detune.value = cents;
        return osc;
      });
      var sub = audioCtx.createOscillator();
      sub.type = 'sine';
      sub.frequency.value = frequency / 2;
      this.oscillators.push(sub);
      var ended = 0;
      this.oscillators.forEach((osc) => {
        osc.connect(this.filter);
        osc.onended = () => {
          if (++ended === this.oscillators.length) this.dispose();
        };
        osc.start(now);
      });
      voices.add(this);
    }

    release() {
      if (this.releasing || this.disposed) return;
      this.releasing = true;
      var now = audioCtx.currentTime;
      var gain = this.envelope.gain;
      if (typeof gain.cancelAndHoldAtTime === 'function') {
        gain.cancelAndHoldAtTime(now);
      } else {
        // Reconstitui o ataque em navegadores sem cancelAndHoldAtTime.
        var elapsed = Math.max(0, now - this.startedAt);
        var current = elapsed < 0.02
          ? 0.001 + (0.06 - 0.001) * elapsed / 0.02
          : 0.06 + (0.6 - 0.06) * Math.min(1, (elapsed - 0.02) / 1.18);
        gain.cancelScheduledValues(now);
        gain.setValueAtTime(current, now);
      }
      gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      gain.setValueAtTime(0, now + 1.0);
      this.oscillators.forEach(function (osc) { osc.stop(now + 1.0); });
    }

    stopImmediately() {
      if (this.disposed) return;
      var now = audioCtx.currentTime;
      this.envelope.gain.cancelScheduledValues(now);
      this.envelope.gain.setValueAtTime(0, now);
      this.oscillators.forEach(function (osc) {
        // stop(now) substitui o stop futuro agendado pelo release.
        try { osc.stop(now); } catch (err) {
          if (err.name !== 'InvalidStateError') console.error(err);
        }
      });
      this.dispose();
    }

    dispose() {
      if (this.disposed) return;
      this.disposed = true;
      this.oscillators.forEach(function (osc) {
        osc.onended = null;
        osc.disconnect();
      });
      this.filter.disconnect();
      this.envelope.disconnect();
      voices.delete(this);
    }
  }

  /* ---------- 2. Volume Master ---------- */
  var vol = document.getElementById('masterVol');
  var volOut = document.getElementById('volValue');
  var volHint = document.getElementById('masterHint');

  function applyVolume() {
    var v = parseInt(vol.value, 10);
    vol.style.setProperty('--fill', v + '%');
    volOut.textContent = v + '%';
    volHint.textContent = v === 0 ? 'Mudo' : (v > 85 ? 'Saída alta' : 'Saída principal');
    if (masterGain) {
      masterGain.gain.setTargetAtTime(v / 100, audioCtx.currentTime, 0.015);
    }
  }
  vol.addEventListener('input', applyVolume);
  applyVolume();

  /* ---------- 3. Colchão de Adoração (Tone Pads) ---------- */
  var tones = document.querySelectorAll('.tone');
  var toneHint = document.getElementById('toneHint');

  function updateToneUI() {
    tones.forEach(function (btn) {
      var selected = btn.dataset.note === activeNote;
      btn.classList.toggle('active', selected);
      btn.setAttribute('aria-pressed', String(selected));
    });
    toneHint.textContent = activeNote ? 'Tom: ' + activeNote : 'Toque para sustentar';
  }
  updateToneUI(); // Remove o destaque estático da Fase 1, sem tocar ao carregar.

  async function toggleKeyPad(note) {
    var version = ++actionVersion;
    try {
      await ensureAudio();
      // STOP ALL ou um toque mais recente vence uma inicialização pendente.
      if (version !== actionVersion) return;
      var previous = activePad;
      if (activeNote === note) {
        activePad = null;
        activeNote = null;
      } else {
        // Inicia a nova voz antes de liberar a anterior: não há lacuna sonora.
        activePad = new AmbientPad(frequencies[note]);
        activeNote = note;
      }
      if (previous) previous.release();
      updateToneUI();
    } catch (err) {
      if (version === actionVersion) reportAudioError(err);
    }
  }

  tones.forEach(function (btn) {
    btn.addEventListener('click', function () { toggleKeyPad(btn.dataset.note); });
  });

  /* ---------- 4. Cenas de Culto ---------- */
  var chips = document.querySelectorAll('.chip');
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      // TODO Fase 2: carregar preset da cena chip.dataset.scene
    });
  });

  /* ---------- 5. Pads de Disparo ---------- */
  var pads = document.querySelectorAll('.pad');
  var padHint = document.getElementById('padHint');

  pads.forEach(function (pad) {
    pad.addEventListener('pointerdown', function () {
      pad.classList.remove('trigger');
      void pad.offsetWidth;           // reinicia a animação
      pad.classList.add('trigger');
      padHint.textContent = pad.querySelector('.name').textContent;
      // TODO Fase 2: disparar o sample pad.dataset.id
    });
    pad.addEventListener('animationend', function () {
      pad.classList.remove('trigger');
    });
  });

  /* ---------- 6. STOP ALL ---------- */
  var btnStop = document.getElementById('panicBtn');
  function stopAll() {
    ++actionVersion;
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(Number(vol.value) / 100, audioCtx.currentTime);
    }
    voices.forEach(function (voice) { voice.stopImmediately(); });
    activePad = null;
    activeNote = null;
    updateToneUI();
    pads.forEach(function (p) { p.classList.remove('trigger'); });
    chips.forEach(function (chip) { chip.classList.remove('active'); });
    padHint.textContent = 'Tudo silenciado';
    if (frequencyData) frequencyData.fill(0);
    if (drawing) drawing.clearRect(0, 0, W, H);
  }
  btnStop.addEventListener('click', stopAll);
  window.addEventListener('pagehide', stopAll);

  /* ---------- 7. WakeLock (placeholder) ---------- */
  var btnWake = document.getElementById('btnWake');
  var wakeLock = null;

  btnWake.addEventListener('click', async function () {
    try {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
        btnWake.classList.remove('active');
        btnWake.textContent = '💡 TELA LIGADA';
      } else if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        btnWake.classList.add('active');
        btnWake.textContent = '💡 TELA ATIVA';
      } else {
        btnWake.classList.toggle('active');
        btnWake.textContent = btnWake.classList.contains('active') ? '💡 TELA ATIVA' : '💡 TELA LIGADA';
      }
    } catch (err) {
      btnWake.classList.toggle('active');
      btnWake.textContent = btnWake.classList.contains('active') ? '💡 TELA ATIVA' : '💡 TELA LIGADA';
    }
  });

  /* ---------- 8. Status MIDI (placeholder) ---------- */
  var badge = document.getElementById('midiBadge');
  var midiText = document.getElementById('midiText');
  function setMidi(ok) {
    badge.classList.toggle('connected', ok);
    midiText.textContent = ok ? 'MIDI: Conectado' : 'MIDI: Desconectado';
  }
  setMidi(false);
  // TODO Fase 2: navigator.requestMIDIAccess().then(...)
  window.__worshipSetMidi = setMidi;

  /* ---------- 9. Visualizador real: analyser mede o master em paralelo à saída ---------- */
  var canvas = document.getElementById('viz');
  var drawing = canvas.getContext('2d');
  var W = 0, H = 45;
  var gradient;

  function resize() {
    if (!drawing) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || 45;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    drawing.setTransform(dpr, 0, 0, dpr, 0, 0);
    gradient = drawing.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#a855f7');
    gradient.addColorStop(1, '#06b6d4');
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    if (!drawing) return;
    drawing.clearRect(0, 0, W, H);
    if (analyser && audioCtx.state === 'running' && voices.size > 0) {
      analyser.getByteFrequencyData(frequencyData);
      var bw = W / frequencyData.length;
      drawing.fillStyle = gradient;
      for (var i = 0; i < frequencyData.length; i++) {
        var level = frequencyData[i] / 255;
        var h = level * (H - 4);
        drawing.globalAlpha = 0.35 + level * 0.65;
        drawing.fillRect(i * bw + bw * 0.18, H - h, Math.max(1, bw * 0.64), h);
      }
      drawing.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
